[pytest]
# The repo root on sys.path, so `import app` resolves however pytest is invoked.
#
# `python -m pytest` adds the working directory itself, which is why the suite
# passed locally while CI — which runs plain `pytest` — failed to import
# conftest at all. Setting it here means both forms work, and neither depends on
# remembering which one to type.
pythonpath = .
testpaths = tests
